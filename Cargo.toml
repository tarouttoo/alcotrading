[workspace]
resolver = "2"
members = [
    "crates/alko-core",
    "crates/alko-store",
    "crates/alko-strategy",
    "crates/alko-sim",
    "crates/alko-connect-binance",
    "crates/alko-connect-bybit",
    "crates/alko-connect-okx",
    "crates/alko-playground",
    "crates/alko-runner",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tarouttoo/alcotrading"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
